<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Library Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50">
    <!-- Optional: Include Navbar if you have one -->

    <div class="min-h-[calc(100vh-80px)] flex flex-col items-center justify-center">
      <div class="py-6 px-4 w-full">
        <div class="grid lg:grid-cols-2 items-center gap-10 max-w-6xl w-full mx-auto">
          
          <!-- Login Form Card -->
          <div class="border border-slate-200 bg-white rounded-2xl p-8 max-w-md w-full shadow-xl max-lg:mx-auto">
            <!-- Django Messages (Errors like "Invalid Credentials") -->
            {% if messages %}
              {% for message in messages %}
                <div class="mb-4 p-3 rounded-lg text-sm {% if message.tags == 'error' %}bg-red-50 text-red-600 border border-red-200{% else %}bg-green-50 text-green-600 border border-green-200{% endif %}">
                  {{ message }}
                </div>
              {% endfor %}
            {% endif %}

            <form method="POST" action="{% url 'login' %}" class="space-y-6">
              {% csrf_token %}
              <div class="mb-10">
                <h1 class="text-slate-900 text-3xl font-bold">Sign in</h1>
                <p class="text-slate-500 text-sm mt-3 leading-relaxed">Welcome back! Please enter your details to access your library dashboard.</p>
              </div>

              <!-- Username Field -->
              <div>
                <label class="text-slate-700 text-sm font-semibold mb-2 block">Username</label>
                <div class="relative flex items-center">
                  <input name="username" type="text" required 
                         class="w-full text-sm text-slate-900 border border-slate-300 pl-4 pr-10 py-3.5 rounded-xl outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition-all" 
                         placeholder="Enter your username" />
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 absolute right-4 text-slate-400">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                  </svg>
                </div>
              </div>

              <!-- Password Field -->
              <div>
                <label class="text-slate-700 text-sm font-semibold mb-2 block">Password</label>
                <div class="relative flex items-center">
                  <input id="password-input" name="password" type="password" required 
                         class="w-full text-sm text-slate-900 border border-slate-300 pl-4 pr-10 py-3.5 rounded-xl outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition-all" 
                         placeholder="Enter your password" />
                  <button type="button" onclick="togglePassword()" class="absolute right-4 text-slate-400 hover:text-slate-600">
                    <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                    </svg>
                  </button>
                </div>
              </div>

              <div class="flex items-center justify-between gap-4">
                <div class="flex items-center">
                  <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-300 rounded cursor-pointer" />
                  <label for="remember-me" class="ml-2 block text-sm text-slate-700 cursor-pointer">Remember me</label>
                </div>
                <a href="#" class="text-sm text-blue-600 hover:text-blue-700 font-semibold transition-colors">Forgot Password?</a>
              </div>

              <div class="pt-4">
                <button type="submit" class="w-full shadow-lg py-3.5 px-4 text-sm font-bold rounded-xl text-white bg-blue-600 hover:bg-blue-700 active:scale-[0.98] transition-all cursor-pointer">
                  Sign in
                </button>
              </div>
            </form>
          </div>

          <!-- Illustration / Image -->
          <div class="max-lg:hidden lg:block">
            <img src="https://readymadeui.com/login-image.webp" class="w-full max-w-lg mx-auto transform hover:scale-105 transition-transform duration-500" alt="Login Illustration" />
          </div>
        </div>
      </div>
    </div>

    <script>
      function togglePassword() {
        const input = document.getElementById('password-input');
        input.type = input.type === 'password' ? 'text' : 'password';
      }
    </script>
  </body>
</html>
