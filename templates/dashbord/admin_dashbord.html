<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

<!-- NAVBAR -->
{% include 'navbar.html' %} 

<div class="flex">

<!-- SIDEBAR -->
<aside class="w-64 bg-white min-h-screen shadow p-4 space-y-3">
  <button onclick="loadSection('books')">📚 Book Management</button>
  <button onclick="loadSection('authors')">✍ Author Management</button>
  <button onclick="loadSection('fines')">💰 Fine Management</button>
  <button onclick="loadSection('students')">🎓 Student Management</button>
  <button onclick="loadSection('users')">👤 User Management</button>
  <button onclick="loadSection('issues')">📌 Issue Management</button>

</aside>

<!-- CONTENT AREA -->
<main class="flex-1 p-6">
  <div id="admin-content" class="bg-white p-6 rounded shadow">
    <h2 class="text-xl font-bold">Welcome Admin 👋</h2>
    <p class="text-gray-600 mt-2">Select a section from the left panel.</p>
  </div>
</main>

</div>

<div id="toast-container" class="fixed top-5 right-5 z-50 space-y-3">
  {% if messages %}
    {% for message in messages %}
      <div
        class="toast px-4 py-3 rounded-lg shadow-lg text-sm flex items-center gap-3
        {% if message.tags == 'error' %}
          bg-red-50 text-red-700 border border-red-200
        {% else %}
          bg-green-50 text-green-700 border border-green-200
        {% endif %}">
        
        {% if message.tags == 'error' %}
          <span class="text-red-600 text-lg">❌</span>
        {% else %}
          <span class="text-green-600 text-lg">✅</span>
        {% endif %}

        <span>{{ message }}</span>

        <button onclick="this.parentElement.remove()"
          class="ml-auto text-gray-400 hover:text-gray-600">
          ✕
        </button>
      </div>
    {% endfor %}
  {% endif %}
</div>


<!-- JS -->
<script>
  setTimeout(() => {
    document.querySelectorAll('.toast').forEach(toast => {
      toast.classList.add('opacity-0', 'translate-x-10');
      setTimeout(() => toast.remove(), 500);
    });
  }, 3000);

  function loadSection(section) {
    fetch(`/admindash/manage/${section}/`)
    .then(res => res.text())
    .then(html => {
      document.getElementById("admin-content").innerHTML = html
    })
    .catch(error => console.error("Error:", error));
  }

  function handleIssue(issueId, action) {
      const url = `/admindash/manage/issues/?issue_id=${issueId}&action=${action}`;

      fetch(url, {
          method: "GET",
          headers: {
              "X-Requested-With": "XMLHttpRequest"
          }
      })
      .then(response => response.json())
      .then(data => {
          if (data.status === 'success') {
              const row = document.getElementById(`issue-row-${issueId}`);

              const statusCell = row.querySelector('.status-cell');
              if (data.new_status_raw === 'issued') {
                  statusCell.innerHTML =
                      `<span class="inline-block px-3 py-1 text-xs rounded-full bg-green-100 text-green-700">Issued</span>`;
              } else {
                  statusCell.innerHTML =
                      `<span class="inline-block px-3 py-1 text-xs rounded-full bg-gray-100 text-gray-700">Returned</span>`;
              }

              row.querySelector('.issue-date-cell').innerText = data.issue_date;
              row.querySelector('.return-date-cell').innerText = data.return_date;

              const actionCell = row.querySelector('.action-cell');
              if (data.new_status_raw === 'issued') {
                  actionCell.innerHTML =
                      `<button onclick="handleIssue('${issueId}', 'return')"
                          class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-xs font-medium">
                          Mark Returned
                       </button>`;
              } else {
                  actionCell.innerHTML =
                      `<span class="text-gray-400 text-xs">Completed</span>`;
              }
          }
      })
      .catch(error => console.error("Error:", error));
  }

  document.addEventListener("change", function (e) {
    if (e.target && e.target.id === "status-filter") {

      const select_status = e.target.value;
      let url = "/admindash/manage/issues/";

      if (select_status) {
        url += `?status=${select_status}`;
      }

      fetch(url, {
        headers: { "X-Requested-With": "XMLHttpRequest" }
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById("issue-table-body").innerHTML = data.html;
      })
      .catch(err => console.error(err));
    }
  });

document.addEventListener('input', function(e) {
  if (e.target && e.target.id === "search_bar") {
    const word = e.target.value.trim();
    let url = "/admindash/manage/issues/";
    
    if (word.length > 0){
      url += `?w=${encodeURIComponent(word)}`
    }

    fetch(url, {
      method: 'GET',
      headers: {
        'X-Requested-With': 'XMLHttpRequest'
      }
    })
    .then(response => response.json())
    .then(data => {
      document.getElementById("issue-table-body").innerHTML = data.html;
    })
    .catch(error => console.error(error))
  }
  if (e.target && e.target.id === "search_book") {
    loadBooks(1);
  }
  if (e.target && e.target.id === "search_author") {
    loadAuthor(1);
  }
});

  function deleteBook(bookId){
    fetch(`/admindash/manage/books/delete/${bookId}/`,{
      method: 'POST',
      headers: {
      "X-Requested-With": "XMLHttpRequest",
      "X-CSRFToken": getCSRFToken()
    }
    })
    .then(response => response.json())
    .then(data => {
      if(data.status === "success"){
        document.getElementById(`book-row-${bookId}`).remove();
      }
    })
    .catch(err => console.log(err))
  }

  function deleteAuthor(authorId){
    fetch(`/admindash/manage/authors/delete/${authorId}/`,{
      method: 'POST',
      headers: {
      "X-Requested-With": "XMLHttpRequest",
      "X-CSRFToken": getCSRFToken()
    }
    })
    .then(response => response.json())
    .then(data => {
      if(data.status === "success"){
        document.getElementById(`author-row-${authorId}`).remove();
      }
    })
    .catch(err => console.log(err))
  }

  function getCSRFToken() {
    return document.querySelector('[name=csrfmiddlewaretoken]').value;
  }

  function loadBooks(page=1){

    let searchInput = document.getElementById("search_book")
    let searchvalue = searchInput ? searchInput.value.trim() : "";

    let url = `/admindash/manage/books/?page=${page}`;

    if (searchvalue.length > 0) {
      url += `&w=${encodeURIComponent(searchvalue)}`;
    }

    fetch(url ,{
      headers:{ 
        "X-Requested-With": "XMLHttpRequest"
      }
    })
    .then(response => response.json())
    .then(data => {
      document.getElementById("book-table-body").innerHTML = data.rows;
      document.getElementById("book-pagination").innerHTML = data.pagination;
    })
    .catch(err => console.error(err));
  }


  function loadAuthor(page=1){

    let searchInput = document.getElementById("search_author")
    let searchvalue = searchInput ? searchInput.value.trim() : "";

    let url = `/admindash/manage/authors/?page=${page}`;

    if (searchvalue.length > 0) {
      url += `&w=${encodeURIComponent(searchvalue)}`;
    }

    fetch(url ,{
      headers:{ 
        "X-Requested-With": "XMLHttpRequest"
      }
    })
    .then(response => response.json())
    .then(data => {
      document.getElementById("author-table-body").innerHTML = data.rows;
      document.getElementById("author-pagination").innerHTML = data.pagination;
    })
    .catch(err => console.error(err));
  }
</script>

<style>
  .sidebar-btn {
    width: 100%;
    text-align: left;
    padding: 8px;
    border-radius: 6px;
    font-weight: 500;
  }
  .sidebar-btn:hover {
    background: #eef2ff;
    color: #4338ca;
  }
</style>

</body>
</html>
