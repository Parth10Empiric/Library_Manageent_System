<h2 class="text-2xl font-bold mb-6">📌 Issue Management</h2>

<!-- Filters -->
<div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
  <div class="flex flex-wrap gap-3">
    <select id="status-filter" class="border px-3 py-2 rounded focus:outline-none focus:ring focus:ring-indigo-200">
      <option value="">All Status</option>
      <option value="requested">Requested</option>
      <option value="issued">Issued</option>
      <option value="returned">Returned</option>
    </select>

    <input type="text" id="search_bar" placeholder="Search by Student ID or Name" class="border px-3 py-2 rounded w-64 focus:outline-none focus:ring focus:ring-indigo-200" />
  </div>
</div>

<div class="overflow-x-auto bg-white rounded shadow">
  <table class="w-full text-sm text-left">
    <thead class="bg-gray-100 text-gray-700">
      <tr>
        <th class="px-4 py-3 font-semibold">Student</th>
        <th class="px-4 py-3 font-semibold">Book</th>
        <th class="px-4 py-3 font-semibold text-center">Status</th>
        <th class="px-4 py-3 font-semibold text-center">Issue Date</th>
        <th class="px-4 py-3 font-semibold text-center">Return Date</th>
        <th class="px-4 py-3 font-semibold text-center">Fine</th>
        <th class="px-4 py-3 font-semibold text-center">Action</th>
      </tr>
    </thead>

    <tbody id="issue-table-body">
      {% include 'admin/partials/admin_issue_rows.html' %}
    </tbody>
  </table>
</div>

<!-- Footer Info -->
<div class="mt-4 text-sm text-gray-500">Showing {{ issues.count }} issue records</div>
