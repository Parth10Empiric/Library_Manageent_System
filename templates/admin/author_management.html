<h2 class="text-2xl font-bold mb-6">✍ Author Management</h2>

<!-- Top Actions -->
<div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
  <input
  id="search_author"
    type="text"
    placeholder="Search author name"
    class="border px-3 py-2 rounded w-72 focus:outline-none focus:ring focus:ring-indigo-200"
  />

  {% comment %} <button
    class="bg-indigo-600 text-white px-5 py-2 rounded hover:bg-indigo-700 transition font-medium">
    + Add Author
  </button> {% endcomment %}

</div>
<input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
<!-- Author Table -->
<div class="overflow-x-auto bg-white rounded shadow">
  <table class="w-full text-sm text-left">
    <thead class="bg-gray-100 text-gray-700">
      <tr>
        <th class="px-4 py-3 w-1/3 font-semibold">Author Name</th>
        <th class="px-4 py-3 w-1/4 font-semibold text-center">Books</th>
        <th class="px-4 py-3 w-1/4 font-semibold text-center">Status</th>
        <th class="px-4 py-3 w-1/4 font-semibold text-center">Action</th>
      </tr>
    </thead>
    <tbody id="author-table-body">
      {% include "admin/partials/admin_author_rows.html" %}
    </tbody>
  </table>
</div>


<div id="author-pagination">
  {% include "admin/partials/admin_author_pagination.html" %}
</div>
