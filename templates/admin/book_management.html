<h2 class="text-2xl font-bold mb-6">📚 Book Management</h2>

<!-- Top Actions -->
<div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
  <div class="flex gap-3">
    <input
      type="text"
      placeholder="Search by title, author or category"
      class="border px-3 py-2 rounded w-72 focus:outline-none focus:ring focus:ring-indigo-200"
    />
  </div>

  <button
    class="bg-indigo-600 text-white px-5 py-2 rounded hover:bg-indigo-700 transition font-medium">
    + Add Book
  </button>
</div>

<!-- Books Table -->
<div class="overflow-x-auto bg-white rounded shadow">
  <table class="w-full text-sm text-left">
    <thead class="bg-gray-100 text-gray-700">
      <tr>
        <th class="px-4 py-3 font-semibold">Title</th>
        <th class="px-4 py-3 font-semibold">Author</th>
        <th class="px-4 py-3 font-semibold">Category</th>
        <th class="px-4 py-3 font-semibold text-center">Status</th>
        <th class="px-4 py-3 font-semibold text-center">Action</th>
      </tr>
    </thead>

    <tbody>
      <!-- Row -->
      <tr class="border-t hover:bg-gray-50 transition">
        <td class="px-4 py-3 font-medium">Clean Code</td>
        <td class="px-4 py-3">Robert C. Martin</td>
        <td class="px-4 py-3">Programming</td>
        <td class="px-4 py-3 text-center">
          <span class="inline-block px-3 py-1 text-xs rounded-full bg-green-100 text-green-700">
            Available
          </span>
        </td>
        <td class="px-4 py-3 text-center">
          <button class="text-red-600 hover:text-red-800 text-sm font-medium">
            Delete
          </button>
        </td>
      </tr>

      <!-- Issued Example -->
      <tr class="border-t hover:bg-gray-50 transition">
        <td class="px-4 py-3 font-medium">Data Structures</td>
        <td class="px-4 py-3">Mark Allen Weiss</td>
        <td class="px-4 py-3">Computer Science</td>
        <td class="px-4 py-3 text-center">
          <span class="inline-block px-3 py-1 text-xs rounded-full bg-red-100 text-red-700">
            Issued
          </span>
        </td>
        <td class="px-4 py-3 text-center">
          <button class="text-red-600 hover:text-red-800 text-sm font-medium">
            Delete
          </button>
        </td>
      </tr>

      <!-- Empty state (keep for later) -->
      <!--
      <tr>
        <td colspan="5" class="px-4 py-6 text-center text-gray-500">
          No books found.
        </td>
      </tr>
      -->
    </tbody>
  </table>
</div>

<!-- Footer Info -->
<div class="mt-4 text-sm text-gray-500">
  Showing 2 books
</div>
