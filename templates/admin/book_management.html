<h2 class="text-2xl font-bold mb-6">📚 Book Management</h2>

<!-- Top Actions -->
<div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
  <div class="flex gap-3">
    <input
      id="search_book"
      type="text"
      placeholder="Search by title, author or category"
      class="border px-3 py-2 rounded w-72 focus:outline-none focus:ring focus:ring-indigo-200"
    />
  </div>

  <a href="{% url 'add_book' %}"
    class="bg-indigo-600 text-white px-5 py-2 rounded hover:bg-indigo-700 transition font-medium">
    + Add Book
</a>
</div>
  <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">

<!-- Books Table -->
<div id="ajax-wrapper" class="overflow-x-auto bg-white rounded shadow">
  <table class="w-full text-sm text-left">
  <thead class="bg-gray-100 text-gray-700">
    <tr>
      <th class="px-4 py-3 w-1/3">Title</th>
      <th class="px-4 py-3 w-1/5">Author</th>
      <th class="px-4 py-3 w-1/8">Category</th>
      <th class="px-4 py-3 text-center w-1/8">Status</th>
      <th class="px-4 py-3 text-center w-1/8">Action</th>
    </tr>
  </thead>

  
  <tbody id="book-table-body">
  {% include "admin/partials/admin_book_rows.html" %}
</tbody>

</table>

{% comment %} pagination {% endcomment %}

</div>

<div id="book-pagination">
  {% include "admin/partials/admin_book_pagination.html" %}
</div>
