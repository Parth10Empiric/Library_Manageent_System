<h2 class="text-2xl font-bold mb-6">💰 Fine Management</h2>
<input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">

<!-- Filters -->
<div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
  <div class="flex flex-wrap gap-3">
    <input
      id="std_fine_search"
      type="text"
      placeholder="Search by Student ID / Username"
      class="border px-3 py-2 rounded w-64 focus:outline-none focus:ring focus:ring-indigo-200"
    />

    <input
      id="book_fine_search"
      type="text"
      placeholder="Search by Book Title"
      class="border px-3 py-2 rounded w-64 focus:outline-none focus:ring focus:ring-indigo-200"
    />

    <select id="fine_status" class="border px-3 py-2 rounded">
      <option value="">All Status</option>
      <option value="paid">Paid</option>
      <option value="unpaid">Unpaid</option>
    </select>
  </div>
</div>

<!-- Fine Table -->
<div class="overflow-x-auto bg-white rounded shadow">
  <table class="w-full text-sm text-left">
    <thead class="bg-gray-100 text-gray-700">
      <tr>
        <th class="px-4 py-3 font-semibold">Student</th>
        <th class="px-4 py-3 font-semibold">Book</th>
        <th class="px-4 py-3 font-semibold text-center">Fine Amount</th>
        <th class="px-4 py-3 font-semibold text-center">Payment</th>
        <th class="px-4 py-3 font-semibold text-center">Status</th>
      </tr>
    </thead>

    <tbody id="fine-table-body">
      <!-- Unpaid Fine -->
      {% include "admin/partials/fines_rows.html" %}
    </tbody>
  </table>
</div>
