<h2 class="text-2xl font-bold mb-6">💰 Fine Management</h2>

<!-- Filters -->
<div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
  <div class="flex flex-wrap gap-3">
    <input
      type="text"
      placeholder="Search by Student ID / Username"
      class="border px-3 py-2 rounded w-64 focus:outline-none focus:ring focus:ring-indigo-200"
    />

    <input
      type="text"
      placeholder="Search by Book Title"
      class="border px-3 py-2 rounded w-64 focus:outline-none focus:ring focus:ring-indigo-200"
    />

    <select class="border px-3 py-2 rounded">
      <option value="">All Status</option>
      <option value="paid">Paid</option>
      <option value="unpaid">Unpaid</option>
    </select>
  </div>
</div>

<!-- Fine Table -->
<div class="overflow-x-auto bg-white rounded shadow">
  <table class="w-full text-sm text-left">
    <thead class="bg-gray-100 text-gray-700">
      <tr>
        <th class="px-4 py-3 font-semibold">Student</th>
        <th class="px-4 py-3 font-semibold">Book</th>
        <th class="px-4 py-3 font-semibold text-center">Fine Amount</th>
        <th class="px-4 py-3 font-semibold text-center">Payment</th>
        <th class="px-4 py-3 font-semibold text-center">Status</th>
        <th class="px-4 py-3 font-semibold text-center">Action</th>
      </tr>
    </thead>

    <tbody>
      <!-- Unpaid Fine -->
      <tr class="border-t hover:bg-gray-50 transition">
        <td class="px-4 py-3 font-medium">
          STU101 <span class="text-xs text-gray-500">(parth)</span>
        </td>
        <td class="px-4 py-3">Clean Code</td>
        <td class="px-4 py-3 text-center font-semibold text-red-600">₹50</td>

        <td class="px-4 py-3 text-center">
          <label class="inline-flex items-center cursor-pointer">
            <input type="checkbox" class="sr-only">
            <div class="w-10 h-5 bg-gray-300 rounded-full relative transition">
              <div class="dot absolute left-1 top-1 w-3 h-3 bg-white rounded-full transition"></div>
            </div>
          </label>
          <div class="text-xs text-gray-500 mt-1">Cash</div>
        </td>

        <td class="px-4 py-3 text-center">
          <span class="inline-block px-3 py-1 text-xs rounded-full bg-red-100 text-red-700">
            Unpaid
          </span>
        </td>

        <td class="px-4 py-3 text-center">
          <button class="text-red-600 hover:text-red-800 text-sm font-medium">
            Delete
          </button>
        </td>
      </tr>

      <!-- Paid Fine -->
      <tr class="border-t hover:bg-gray-50 transition">
        <td class="px-4 py-3 font-medium">
          STU102 <span class="text-xs text-gray-500">(alex)</span>
        </td>
        <td class="px-4 py-3">Data Structures</td>
        <td class="px-4 py-3 text-center font-semibold text-green-600">₹30</td>

        <td class="px-4 py-3 text-center text-gray-400 text-xs">
          Paid Online
        </td>

        <td class="px-4 py-3 text-center">
          <span class="inline-block px-3 py-1 text-xs rounded-full bg-green-100 text-green-700">
            Paid
          </span>
        </td>

        <td class="px-4 py-3 text-center">
          <button class="text-red-600 hover:text-red-800 text-sm font-medium">
            Delete
          </button>
        </td>
      </tr>

      <!-- Empty State -->
      <!--
      <tr>
        <td colspan="6" class="px-4 py-6 text-center text-gray-500">
          No fines found.
        </td>
      </tr>
      -->
    </tbody>
  </table>
</div>

<!-- Footer -->
<div class="mt-4 text-sm text-gray-500">
  Showing 2 fines
</div>
