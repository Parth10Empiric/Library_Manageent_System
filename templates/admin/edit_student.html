<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Student</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div class="bg-white shadow-lg rounded-lg w-full max-w-lg p-6">
    <h2 class="text-2xl font-semibold text-gray-800 mb-6 text-center">
        Edit Student Details
    </h2>

    {% if messages %}
        {% for message in messages %}
            <div class="mb-4 px-4 py-2 rounded text-white 
                {% if message.tags == 'error' %} bg-red-500 {% else %} bg-green-500 {% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="post" class="space-y-4">
        {% csrf_token %}

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
                Student ID
            </label>
            <input type="text" name="student_id" value="{{ student.sudent_id }}" readonly
                   class="w-full border-slate-300 border p-2.5 rounded-lg bg-gray-100 text-gray-600 cursor-not-allowed"
                   required>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
                Full Name
            </label>
            <input type="text" name="name" value="{{ student.name }}"
                   class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                   required>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
                Department
            </label>
            <select name="department"
                    class="w-full border px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    required>
                <option value="">Select Department</option>
                    
                <option value="Information Technology"
                    {% if student.department == "Information Technology" %}selected{% endif %}>
                    Information Technology
                </option>
            
                <option value="Electronics"
                    {% if student.department == "Electronics" %}selected{% endif %}>
                    Electronics
                </option>
            
                <option value="Mechanical"
                    {% if student.department == "Mechanical" %}selected{% endif %}>
                    Mechanical
                </option>
            </select>

        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Email
          </label>
      
          <input
            type="email"
            name="email"
            value="{{ student.user.email }}"
            class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="example@email.com (optional)"
          >
        </div>

        <div class="flex justify-between items-center pt-4">
            <a href="{% url 'admindash' %}"
               class="text-gray-600 hover:text-gray-900">
                Cancel
            </a>

            <button type="submit"
                    class="bg-blue-600 text-white px-5 py-2 rounded hover:bg-blue-700 transition">
                Update Student
            </button>
        </div>
    </form>
</div>

</body>
</html>
