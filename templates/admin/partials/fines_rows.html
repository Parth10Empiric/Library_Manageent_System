{% for fine in fines %}
  <tr id="fine-row-{{ fine.id }}" class="border-t hover:bg-gray-50 transition">
  <td class="px-4 py-3 font-medium">
    {{ fine.student.sudent_id }}
    <span class="text-xs text-gray-500">({{ fine.student.user.username }})</span>
  </td>

  <td class="px-4 py-3">{{ fine.issue.book.title }}</td>

  {% if fine.is_paid %}
    <td class="px-4 py-3 text-center font-semibold text-green-600">
      {{ fine.ammount }}
    </td>

    <td class="px-4 py-3 text-center text-gray-400 text-xs">
      Paid {{ fine.get_payment_mode_display }}
    </td>

    <td class="px-4 py-3 text-center">
      <span class="inline-block px-3 py-1 text-xs rounded-full bg-green-100 text-green-700">
        Paid
      </span>
    </td>
  {% else %}
    <td class="px-4 py-3 text-center font-semibold text-red-600">
      {{ fine.ammount }}
    </td>

    <td class="px-4 py-3 text-center">
      <label class="inline-flex items-center cursor-pointer">
        <input
          type="checkbox"
          class="sr-only peer cash-toggle"
          data-fine-id="{{ fine.id }}"
        />
        <div class="w-10 h-5 bg-gray-300 rounded-full relative transition peer-checked:bg-green-600">
          <div class="absolute left-1 top-1 w-3 h-3 bg-white rounded-full transition peer-checked:translate-x-5"></div>
        </div>
      </label>
      <div class="text-xs text-gray-500 mt-1">Cash</div>
    </td>

    <td class="px-4 py-3 text-center">
      <span class="inline-block px-3 py-1 text-xs rounded-full bg-red-100 text-red-700">
        Unpaid
      </span>
    </td>
  {% endif %}

</tr>
{% empty %}
  <tr>
    <td colspan="6" class="px-4 py-6 text-center text-gray-500">No fines found.</td>
  </tr>
{% endfor %}
