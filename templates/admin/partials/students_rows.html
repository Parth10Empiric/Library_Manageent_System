{% for student in students %}
  <tr class="border-t hover:bg-gray-50 transition" id="student-row-{{ student.id }}">
    <td class="px-4 py-3 font-medium">
      {{ student.user.username }}
      <div class="text-xs text-gray-500">{{ student.sudent_id }}</div>
    </td>
    <td class="px-4 py-3">{{ student.department }}</td>
    <td class="px-4 py-3 text-center">{{ student.issue_count|default:'0' }}</td>
    {% if student.totle_fine %}
      <td class="px-4 py-3 text-center font-semibold text-red-600">₹{{ student.totle_fine }}</td>
    {% else %}
      <td class="px-4 py-3 text-center font-semibold text-green-600">₹0</td>
    {% endif %}

    <td class="px-4 py-3 text-center">
      <span class="inline-block px-3 py-1 text-xs rounded-full bg-green-100 text-green-700">Active</span>
    </td>
    <td class="px-4 py-3 text-center">
      <a href="{% url 'editstudent' student.id %}" class="text-indigo-600 hover:underline text-sm">Edit</a>
      <button onclick="deleteStudent('{{ student.id }}')" class="text-red-600 hover:underline text-sm ml-2">Delete</button>
    </td>
  </tr>
{% empty %}
  <tr>
    <td colspan="6" class="px-4 py-6 text-center text-gray-500">No students found.</td>
  </tr>
{% endfor %}
