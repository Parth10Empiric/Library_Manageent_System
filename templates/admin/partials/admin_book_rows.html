{% for book in books %}
<tr class="border-t hover:bg-gray-50 transition" id="book-row-{{ book.id }}">
  <td class="px-4 py-3 font-medium">{{ book.title }}</td>
  <td class="px-4 py-3">{{ book.author }}</td>
  <td class="px-4 py-3">{{ book.category }}</td>

  <td class="px-4 py-3 text-center">
    {% if book.is_available %}
      <span class="inline-block px-3 py-1 text-xs rounded-full bg-green-100 text-green-700">
        Available
      </span>
    {% else %}
      <span class="inline-block px-3 py-1 text-xs rounded-full bg-red-100 text-red-700">
        Issued
      </span>
    {% endif %}
  </td>

  <td class="px-4 py-3 text-center">
    <button onclick="deleteBook('{{ book.id }}')"
      class="text-red-600 hover:text-red-800 text-sm font-medium">
      Delete
    </button>
  </td>
</tr>
{% empty %}
<tr>
  <td colspan="5" class="px-4 py-6 text-center text-gray-500">
    No books found.
  </td>
</tr>
{% endfor %}
