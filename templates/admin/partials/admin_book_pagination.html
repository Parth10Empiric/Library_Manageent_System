
<div class="mt-auto pt-4 border-t flex items-center justify-center gap-2 shrink-0">
  {% if books.has_previous %}
    <button onclick="loadBooks({{ books.previous_page_number }})" class="p-2 hover:bg-gray-100 rounded">
      <svg width="12" height="18" viewBox="0 0 12 18" fill="none">
        <path d="M11 1L2 9.24242L11 17" stroke="#111820" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>
  {% endif %}

  <div class="flex gap-1">
    {% for num in books.paginator.page_range %}
      {% if books.number == num %}
        <span class="flex items-center justify-center w-8 h-8 bg-indigo-600 text-white rounded">{{ num }}</span>
      {% elif num > books.number|add:'-3' and num < books.number|add:'3' %}
        <button onclick="loadBooks({{ num }})" class="w-8 h-8 border border-gray-200 rounded hover:bg-gray-50">{{ num }}</button>
      {% endif %}
    {% endfor %}
  </div>

  {% if books.has_next %}
    <button onclick="loadBooks({{ books.next_page_number }})" class="p-2 hover:bg-gray-100 rounded">
      <svg width="12" height="18" viewBox="0 0 12 18" fill="none">
        <path d="M1 1L10 9.24242L1 17" stroke="#111820" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>
  {% endif %}
</div>
