  {% for author in authors %}
    <tr class="border-t hover:bg-gray-50 transition" id="author-row-{{ author.id }}">
      <td class="px-4 py-3 font-medium">{{ author.name }}</td>
      <td class="px-4 py-3 text-center">{{ author.book_count }}</td>
      <td class="px-4 py-3 text-center">
        <span class="inline-block px-3 py-1 text-xs rounded-full bg-green-100 text-green-700">
          Active
        </span>
      </td>
      <td class="px-4 py-3 text-center">
        <button onclick="deleteAuthor('{{ author.id }}')"
          class="text-red-600 hover:text-red-800 text-sm font-medium">
          Delete
        </button>
      </td>
    </tr>
  {% empty %}
    <tr>
      <td colspan="4" class="px-4 py-6 text-center text-gray-500">
        No authors found.
      </td>
    </tr>
  {% endfor %}
