<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Add Book</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-3xl bg-white rounded-lg shadow p-8">
      <!-- Header -->
      <div class="mb-6">
        <h2 class="text-2xl font-bold text-gray-800">📘 Add New Book</h2>
        <p class="text-sm text-gray-500 mt-1">Enter book details to add it to the library</p>
      </div>

      <!-- Form -->
      <form method="POST" action="{% url 'add_book' %}" class="space-y-6">
        {% csrf_token %}

        <!-- Book Title -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Book Title</label>
          <input type="text" name="title" placeholder="Enter book title" class="w-full border px-4 py-2 rounded focus:outline-none focus:ring focus:ring-indigo-200" required />
        </div>

        <!-- Author & Category -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Author</label>
            <input type="text" name="author" placeholder="Enter book author" class="w-full border px-4 py-2 rounded focus:outline-none focus:ring focus:ring-indigo-200" required />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
            <input type="text" name="category" placeholder="Enter book category" class="w-full border px-4 py-2 rounded focus:outline-none focus:ring focus:ring-indigo-200" required />
          </div>
        </div>

        <!-- Buttons -->
        <div class="flex justify-end gap-4 pt-4 border-t">
          <a href="{% url 'admindash' %}" class="px-5 py-2 rounded border text-gray-600 hover:bg-gray-50 transition">Cancel</a>
          <button type="submit" class="px-6 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 transition font-medium">Save Book</button>
        </div>
      </form>
    </div>
  </body>
</html>
