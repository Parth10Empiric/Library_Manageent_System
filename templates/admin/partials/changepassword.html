<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-indigo-700 min-h-screen flex items-center justify-center">

<div class="bg-indigo-100 rounded-lg shadow-lg p-6 w-full max-w-sm">

    <div class="flex items-center gap-3 mb-6">
        <div class="w-10 h-10 rounded-full bg-indigo-300 flex items-center justify-center text-indigo-800 font-bold uppercase">
            {{ ouser.username|slice:":1" }}
        </div>
        <div>
            <p class="text-sm font-semibold text-gray-800">{{ ouser.username }}</p>
            <p class="text-xs text-gray-600">
                {% if ouser.is_superuser %}
                    Admin
                {% elif ouser.is_staff %}
                    Staff
                {% else %}
                    Student
                {% endif %}
            </p>
        </div>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="mb-4 px-3 py-2 rounded text-white 
                {% if message.tags == 'error' %}bg-red-500{% else %}bg-green-500{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="post" class="space-y-4">
        {% csrf_token %}

        <div>
            <label class="block text-indigo-600 text-sm mb-1">New Password</label>
            <input type="password" name="password"
                   class="w-full px-3 py-2 border-b-2 border-indigo-500 focus:outline-none focus:bg-gray-200"
                   required>
        </div>

        <div>
            <label class="block text-indigo-600 text-sm mb-1">Confirm Password</label>
            <input type="password" name="cpassword"
                   class="w-full px-3 py-2 border-b-2 border-indigo-500 focus:outline-none focus:bg-gray-200"
                   required>
        </div>

        <button type="submit"
                class="w-full bg-indigo-700 hover:bg-pink-700 text-white font-semibold py-2 rounded transition">
            Update Password
        </button>
    </form>

</div>

</body>
</html>
