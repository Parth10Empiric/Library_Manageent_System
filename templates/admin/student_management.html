<h2 class="text-2xl font-bold mb-6">🎓 Student Management</h2>

<!-- Filters & Actions -->
<div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
  <div class="flex flex-wrap gap-3">
    <select class="border px-3 py-2 rounded focus:outline-none focus:ring focus:ring-indigo-200">
      <option value="">All Departments</option>
      <option value="IT">IT</option>
      <option value="CSE">CSE</option>
      <option value="ECE">ECE</option>
    </select>

    <input
      type="text"
      placeholder="Search by Student ID or Name"
      class="border px-3 py-2 rounded w-64 focus:outline-none focus:ring focus:ring-indigo-200"
    />
  </div>

  <button
    class="bg-indigo-600 text-white px-5 py-2 rounded hover:bg-indigo-700 transition font-medium">
    + Add Student
  </button>
</div>

<!-- Student Table -->
<div class="overflow-x-auto bg-white rounded shadow">
  <table class="w-full text-sm text-left">
    <thead class="bg-gray-100 text-gray-700">
      <tr>
        <th class="px-4 py-3 font-semibold">Student</th>
        <th class="px-4 py-3 font-semibold">Department</th>
        <th class="px-4 py-3 font-semibold text-center">Issued Books</th>
        <th class="px-4 py-3 font-semibold text-center">Total Fine</th>
        <th class="px-4 py-3 font-semibold text-center">Status</th>
        <th class="px-4 py-3 font-semibold text-center">Action</th>
      </tr>
    </thead>

    <tbody>
      <!-- Row -->
      <tr class="border-t hover:bg-gray-50 transition">
        <td class="px-4 py-3 font-medium">
          Parth Patel
          <div class="text-xs text-gray-500">STU101</div>
        </td>
        <td class="px-4 py-3">IT</td>
        <td class="px-4 py-3 text-center">3</td>
        <td class="px-4 py-3 text-center font-semibold text-red-600">₹50</td>
        <td class="px-4 py-3 text-center">
          <span class="inline-block px-3 py-1 text-xs rounded-full bg-green-100 text-green-700">
            Active
          </span>
        </td>
        <td class="px-4 py-3 text-center">
          <button class="text-indigo-600 hover:underline text-sm">Edit</button>
          <button class="text-red-600 hover:underline text-sm ml-2">Delete</button>
        </td>
      </tr>

      <tr class="border-t hover:bg-gray-50 transition">
        <td class="px-4 py-3 font-medium">
          Alex Johnson
          <div class="text-xs text-gray-500">STU102</div>
        </td>
        <td class="px-4 py-3">CSE</td>
        <td class="px-4 py-3 text-center">1</td>
        <td class="px-4 py-3 text-center font-semibold text-green-600">₹0</td>
        <td class="px-4 py-3 text-center">
          <span class="inline-block px-3 py-1 text-xs rounded-full bg-gray-100 text-gray-600">
            No Issues
          </span>
        </td>
        <td class="px-4 py-3 text-center">
          <button class="text-indigo-600 hover:underline text-sm">Edit</button>
          <button class="text-red-600 hover:underline text-sm ml-2">Delete</button>
        </td>
      </tr>

      <!-- Empty State -->
      <!--
      <tr>
        <td colspan="6" class="px-4 py-6 text-center text-gray-500">
          No students found.
        </td>
      </tr>
      -->
    </tbody>
  </table>
</div>

<!-- Footer Info -->
<div class="mt-4 text-sm text-gray-500">
  Showing 2 students
</div>
