<h2 class="text-2xl font-bold mb-6">🎓 Student Management</h2>

<!-- Filters & Actions -->
<div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
  <div class="flex flex-wrap gap-3">
    <select id="department-filter" class="border px-3 py-2 rounded focus:outline-none focus:ring focus:ring-indigo-200">
      <option value="">All Departments</option>
      <option value="Information Technology">Information Technology</option>
      <option value="Electronics">Electronics</option>
      <option value="Mechanical">Mechanical</option>
    </select>

    <input type="text" id="search_student" placeholder="Search by Student ID or Name" class="border px-3 py-2 rounded w-64 focus:outline-none focus:ring focus:ring-indigo-200" />
  </div>

  <a href="{% url 'addstd' %}" class="bg-indigo-600 text-white px-5 py-2 rounded hover:bg-indigo-700 transition font-medium">+ Add Student</a>
</div>
<input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">

<!-- Student Table -->
<div class="overflow-x-auto bg-white rounded shadow">
  <table class="w-full text-sm text-left">
    <thead class="bg-gray-100 text-gray-700">
      <tr>
        <th class="px-4 py-3 font-semibold">Student</th>
        <th class="px-4 py-3 font-semibold">Department</th>
        <th class="px-4 py-3 font-semibold text-center">Issued Books</th>
        <th class="px-4 py-3 font-semibold text-center">Total Fine</th>
        <th class="px-4 py-3 font-semibold text-center">Status</th>
        <th class="px-4 py-3 font-semibold text-center">Action</th>
      </tr>
    </thead>

    <tbody id="students-table-body">
      {% include "admin/partials/students_rows.html" %}

      {% comment %} <span class="inline-block px-3 py-1 text-xs rounded-full bg-gray-100 text-gray-600">No Issues</span> {% endcomment %}
    </tbody>
  </table>
</div>
