<h2 class="text-2xl font-bold mb-6">👤 User Management</h2>

<!-- Filters -->
<div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
  <div class="flex flex-wrap gap-3">
    <input
      type="text"
      id="search-user"
      placeholder="Search by username"
      class="border px-3 py-2 rounded w-72 focus:outline-none focus:ring focus:ring-indigo-200"
    />

    <select id="rollfilter" class="border px-3 py-2 rounded focus:outline-none focus:ring focus:ring-indigo-200">
      <option value="">All Roles</option>
      <option value="admin">Admin</option>
      <option value="staff">Staff</option>
      <option value="student">Student</option>
    </select>

    <select id="statusfilter" class="border px-3 py-2 rounded focus:outline-none focus:ring focus:ring-indigo-200">
      <option value="">All Status</option>
      <option value="active">Active</option>
      <option value="inactive">Inactive</option>
    </select>
  </div>
</div>

<!-- User Table -->
<div class="overflow-x-auto bg-white rounded shadow">
  <table class="w-full text-sm text-left">
    <thead class="bg-gray-100 text-gray-700">
      <tr>
        <th class="px-4 py-3 font-semibold">User</th>
        <th class="px-4 py-3 font-semibold">Email</th>
        <th class="px-4 py-3 font-semibold">Role</th>
        <th class="px-4 py-3 font-semibold text-center">Last Login</th>
        <th class="px-4 py-3 font-semibold text-center">Date Joined</th>
        <th class="px-4 py-3 font-semibold text-center">Status</th>
        <th class="px-4 py-3 font-semibold text-center">Action</th>
      </tr>
    </thead>

    <tbody id="users-table-body">

      {% include "admin/partials/user_row.html" %}
      
    </tbody>
  </table>
</div>

<!-- Footer -->
<div class="mt-4 text-sm text-gray-500">
  Showing {{ allusers.count }} users
</div>
